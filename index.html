<!doctype html>
<html lang="en" class="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Bali Sai Praveen — Computer Science Engineering Student, Full Stack Developer, and MERN Stack Specialist."
    />
    <meta name="keywords" content="Bali Sai Praveen, Portfolio, Full Stack Developer, MERN Stack, React, Node.js, Express, MongoDB, Java DSA" />
    <meta name="author" content="Bali Sai Praveen" />
    <meta name="theme-color" content="#F5F4EF" />
    <title>Bali Sai Praveen | Portfolio</title>
    
    <!-- GOOGLE FONTS: OSWALD & POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- REMIX ICON CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />

    <noscript>
      <style>
        #loader { display: none !important; }
        html.loading { overflow: auto !important; }
        .reveal, .reveal-heading, .reveal-fade-left, .reveal-fade-right, .reveal-scale, .reveal-image, .stagger-parent .stagger-item {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- TOP READING PROGRESS BAR -->
    <div id="top-scroll-progress" aria-hidden="true"></div>

    <!-- MINIMAL CUSTOM CURSOR (Desktop Only) -->
    <div id="custom-cursor" aria-hidden="true">
      <div class="cursor-dot"></div>
      <div class="cursor-ring"></div>
    </div>

    <!-- WELCOME PRELOADER -->
    <div id="loader" aria-hidden="true">
      <div class="loader-word">
        <span style="--i:0">W</span>
        <span style="--i:1">e</span>
        <span style="--i:2">l</span>
        <span style="--i:3">c</span>
        <span style="--i:4">o</span>
        <span style="--i:5">m</span>
        <span style="--i:6">e</span>
      </div>
    </div>

    <!-- SCROLL TO TOP PROGRESS CIRCLE -->
    <div class="progress-wrap" id="progress-wrap" title="Scroll to Top" role="button" aria-label="Scroll to Top">
      <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" id="progress-path" />
      </svg>
      <i class="ri-arrow-up-line progress-arrow"></i>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- MAIN APP CONTAINER -->
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
